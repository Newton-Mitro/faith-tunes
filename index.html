<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Faith Tunes — browse song books, categories, songs and lyrics."
    />

    <meta name="theme-color" content="#059669" />

    <title>Faith Tunes</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",

        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- SQLite -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>

    <!-- Application CSS -->
    <link rel="stylesheet" href="./css/app.css" />
  </head>

  <body
    class="min-h-screen bg-slate-50 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100"
  >
    <div id="app" class="flex min-h-screen flex-col">
      <div class="flex min-h-screen items-center justify-center">
        <div class="text-center">
          <div class="text-4xl">🎵</div>

          <p class="mt-4 text-sm text-slate-500">Loading Faith Tunes...</p>
        </div>
      </div>
    </div>

    <!-- Application -->
    <script src="./js/database.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/icons.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/pages.js"></script>
    <script src="./js/router.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
