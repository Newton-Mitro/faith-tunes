<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Song Library — browse song books, categories, songs and lyrics."
    />

    <meta name="theme-color" content="#059669" />

    <title>Song Library</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->

    <script>
      tailwind.config = {
        darkMode: "class",

        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>

    <script>
      let db;

      async function initDatabase() {
        const SQL = await initSqlJs({
          locateFile: (file) =>
            `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${file}`,
        });

        const response = await fetch("./db/songs.sqlite");

        const buffer = await response.arrayBuffer();

        db = new SQL.Database(new Uint8Array(buffer));

        console.log("SQLite database loaded");
      }
    </script>

    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .lyrics {
        white-space: pre-line;
      }

      .page-enter {
        animation: pageEnter 0.2s ease-out;
      }

      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      ::selection {
        background: #a7f3d0;
        color: #064e3b;
      }
    </style>
  </head>

  <body
    class="min-h-screen transition-colors bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100"
  >
    <!-- =========================================================
     APPLICATION
========================================================= -->

    <div id="app" class="flex flex-col min-h-screen"></div>

    <!-- =========================================================
     JAVASCRIPT
========================================================= -->

    <script>
      /* =========================================================
         STATE
      ========================================================= */

      const state = {
        search: "",

        fontSize: 20,

        favorites: JSON.parse(
          localStorage.getItem("song-library-favorites") || "[]",
        ),
      };

      /* =========================================================
         HELPERS
      ========================================================= */

      function getBook(id) {
        return SONG_BOOKS.find((book) => book.id === Number(id));
      }

      function getCategory(id) {
        return categories.find((category) => category.id === Number(id));
      }

      function getSong(id) {
        return songs.find((song) => song.id === Number(id));
      }

      function getBookSongs(bookId) {
        return songs.filter((song) => song.bookId === Number(bookId));
      }

      function getCategorySongs(categoryId) {
        return songs.filter((song) => song.categoryId === Number(categoryId));
      }

      function isFavorite(songId) {
        return state.favorites.includes(Number(songId));
      }

      function saveFavorites() {
        localStorage.setItem(
          "song-library-favorites",
          JSON.stringify(state.favorites),
        );
      }

      function toggleFavorite(songId) {
        songId = Number(songId);

        if (state.favorites.includes(songId)) {
          state.favorites = state.favorites.filter((id) => id !== songId);
        } else {
          state.favorites.push(songId);
        }

        saveFavorites();

        router();
      }

      /* =========================================================
         ICONS
      ========================================================= */

      const icons = {
        music: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 19V6l10-3v13M9 19a3 3 0 11-6 0 3 3 0 016 0zm10-3a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
          `,

        search: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m21 21-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/>
              </svg>
          `,

        arrow: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m9 5 7 7-7 7"/>
              </svg>
          `,

        back: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m15 19-7-7 7-7"/>
              </svg>
          `,

        heart: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="currentColor"
                   viewBox="0 0 24 24"
                   class="w-5 h-5">
                  <path d="M12 21s-7-4.35-9.33-8.28C.93 9.78 2.12 5.5 6.14 4.6A5.25 5.25 0 0 1 12 7.25 5.25 5.25 0 0 1 17.86 4.6c4.02.9 5.21 5.18 3.47 8.12C19 16.65 12 21 12 21Z"/>
              </svg>
          `,

        sun: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m16.36-6.36-.7.7M5.34 18.66l-.7.7m13.02 0-.7-.7M6.05 6.34l-.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
              </svg>
          `,

        moon: `
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor"
                   class="w-5 h-5">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
              </svg>
          `,
      };

      /* =========================================================
         HEADER
      ========================================================= */

      function renderHeader() {
        return `

              <header
                  class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-950/95"
              >

                  <div
                      class="flex items-center justify-between h-16 px-4 mx-auto max-w-7xl sm:px-6 lg:px-8"
                  >

                      <a
                          href="#/"
                          class="flex items-center gap-3"
                      >

                          <div
                              class="flex items-center justify-center w-10 h-10 text-white rounded-xl bg-emerald-600"
                          >
                              ${icons.music}
                          </div>

                          <div>

                              <h1 class="font-bold">
                                  Song Library
                              </h1>

                              <p class="hidden text-xs text-slate-500 dark:text-slate-400 sm:block">
                                  Songs & Hymns Collection
                              </p>

                          </div>

                      </a>


                      <nav class="items-center hidden gap-1 md:flex">

                          <a
                              href="#/"
                              class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 hover:text-emerald-600 dark:text-slate-300 dark:hover:bg-slate-800"
                          >
                              Home
                          </a>

                          <a
                              href="#/books"
                              class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 hover:text-emerald-600 dark:text-slate-300 dark:hover:bg-slate-800"
                          >
                              Song Books
                          </a>

                          <a
                              href="#/categories"
                              class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 hover:text-emerald-600 dark:text-slate-300 dark:hover:bg-slate-800"
                          >
                              Categories
                          </a>

                      </nav>


                      <div class="flex items-center gap-1">

                          <a
                              href="#/search"
                              class="rounded-lg p-2.5 text-slate-500 hover:bg-slate-100 hover:text-emerald-600 dark:hover:bg-slate-800"
                              title="Search"
                          >
                              ${icons.search}
                          </a>


                          <button
                              onclick="toggleTheme()"
                              class="rounded-lg p-2.5 text-slate-500 hover:bg-slate-100 hover:text-emerald-600 dark:hover:bg-slate-800"
                              title="Toggle theme"
                          >
                              <span id="themeIcon">
                                  ${
                                    document.documentElement.classList.contains(
                                      "dark",
                                    )
                                      ? icons.sun
                                      : icons.moon
                                  }
                              </span>
                          </button>


                          <a
                              href="#/favorites"
                              class="relative rounded-lg p-2.5 text-slate-500 hover:bg-slate-100 hover:text-emerald-600 dark:hover:bg-slate-800"
                              title="Favorites"
                          >
                              ${icons.heart}

                              ${
                                state.favorites.length
                                  ? `
                                          <span
                                              class="
                                                  absolute
                                                  -right-0.5
                                                  -top-0.5
                                                  flex
                                                  h-4
                                                  min-w-4
                                                  items-center
                                                  justify-center
                                                  rounded-full
                                                  bg-emerald-600
                                                  px-1
                                                  text-[10px]
                                                  font-bold
                                                  text-white
                                              "
                                          >
                                              ${state.favorites.length}
                                          </span>
                                      `
                                  : ""
                              }

                          </a>

                      </div>

                  </div>

              </header>

          `;
      }

      /* =========================================================
         FOOTER
      ========================================================= */

      function renderFooter() {
        return `

              <footer
                  class="mt-auto bg-white border-t border-slate-200 dark:border-slate-800 dark:bg-slate-950"
              >

                  <div
                      class="flex flex-col gap-4 px-4 py-8 mx-auto max-w-7xl sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"
                  >

                      <div>

                          <p class="font-semibold">
                              Song Library
                          </p>

                          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
                              Browse songs, hymns and song SONG_BOOKS.
                          </p>

                      </div>

                      <p class="text-sm text-slate-500 dark:text-slate-400">
                          © 2026 Song Library
                      </p>

                  </div>

              </footer>

          `;
      }

      /* =========================================================
         SONG CARD
      ========================================================= */

      function songCard(song) {
        const category = getCategory(song.categoryId);
        const book = getBook(song.bookId);

        return `

              <a
                  href="#/song/${song.id}"
                  class="flex items-center gap-4 p-4 border-b group border-slate-200 last:border-0 hover:bg-slate-50 dark:border-slate-800 dark:hover:bg-slate-900"
              >

                  <div
                      class="flex items-center justify-center text-sm font-bold h-11 w-11 shrink-0 rounded-xl bg-emerald-50 text-emerald-600 dark:bg-emerald-950"
                  >
                      ${song.number}
                  </div>


                  <div class="flex-1 min-w-0">

                      <h3
                          class="font-semibold truncate group-hover:text-emerald-600"
                      >
                          ${song.title}
                      </h3>

                      <p class="mt-1 text-sm truncate text-slate-500 dark:text-slate-400">

                          ${book.title}

                          <span class="mx-1">•</span>

                          ${category.name}

                      </p>

                  </div>


                  ${
                    isFavorite(song.id)
                      ? `
                              <span class="text-emerald-600">
                                  ${icons.heart}
                              </span>
                          `
                      : ""
                  }


                  <span class="text-slate-400 group-hover:text-emerald-600">
                      ${icons.arrow}
                  </span>

              </a>

          `;
      }

      /* =========================================================
         HOME PAGE
      ========================================================= */

      function homePage() {
        return `

              <div class="page-enter">

                  <!-- HERO -->

                  <section
                      class=" bg-gradient-to-br from-emerald-700 via-emerald-600 to-teal-600"
                  >

                      <div
                          class="px-4 py-16 mx-auto max-w-7xl sm:px-6 lg:px-8 lg:py-20"
                      >

                          <div class="max-w-3xl mx-auto text-center">

                              <span
                                  class="inline-flex px-4 py-2 text-sm font-medium text-white rounded-full bg-white/10"
                              >
                                  ${songs.length} songs available
                              </span>


                              <h2
                                  class="mt-6 text-4xl font-bold tracking-tight text-white sm:text-5xl"
                              >
                                  Find Your Song
                              </h2>


                              <p
                                  class="max-w-2xl mx-auto mt-4 text-emerald-50"
                              >
                                  Browse song books, explore categories,
                                  or search the complete collection.
                              </p>


                              <form
                                  onsubmit="homeSearch(event)"
                                  class="relative max-w-2xl mx-auto mt-8"
                              >

                                  <div
                                      class="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none text-slate-400"
                                  >
                                      ${icons.search}
                                  </div>


                                  <input
                                      id="homeSearchInput"
                                      type="search"
                                      placeholder="Search songs, titles or categories..."
                                      class="w-full pl-12 pr-5 bg-white border-0 shadow-xl outline-none h-14 rounded-2xl text-slate-900 placeholder:text-slate-400"
                                  >

                              </form>

                          </div>

                      </div>

                  </section>


                  <!-- STATS -->

                  <section
                      class="bg-white border-b border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                  >

                      <div
                          class="grid grid-cols-2 mx-auto max-w-7xl sm:grid-cols-4"
                      >

                          ${statCard(SONG_BOOKS.length, "Song Books")}

                          ${statCard(songs.length, "Songs")}

                          ${statCard(categories.length, "Categories")}

                          ${statCard(state.favorites.length, "Favorites")}

                      </div>

                  </section>


                  <!-- BOOKS -->

                  <section class="py-16">

                      <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">

                          <sectionHeader
                              title="Song Books"
                              description="Browse songs organized into different collections."
                              link="#/books"
                              linkText="View all"
                          ></sectionHeader>


                          <div
                              class="grid gap-5 mt-8 sm:grid-cols-2 lg:grid-cols-4"
                          >

                              ${SONG_BOOKS.map(bookCard).join("")}

                          </div>

                      </div>

                  </section>


                  <!-- CATEGORIES -->

                  <section
                      class="py-16 bg-white border-y border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                  >

                      <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">

                          <sectionHeader
                              title="Browse by Category"
                              description="Discover songs based on their theme."
                              link="#/categories"
                              linkText="View all"
                          ></sectionHeader>


                          <div
                              class="grid grid-cols-2 gap-3 mt-8 sm:grid-cols-3 lg:grid-cols-6"
                          >

                              ${categories.map(categoryCard).join("")}

                          </div>

                      </div>

                  </section>


                  <!-- POPULAR -->

                  <section class="py-16">

                      <div class="max-w-4xl px-4 mx-auto sm:px-6">

                          <sectionHeader
                              title="Songs"
                              description="Explore songs from the collection."
                              link="#/songs"
                              linkText="View all"
                          ></sectionHeader>


                          <div
                              class="mt-6 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                          >

                              ${songs.slice(0, 6).map(songCard).join("")}

                          </div>

                      </div>

                  </section>

              </div>

          `;
      }

      /* =========================================================
         SMALL COMPONENTS
      ========================================================= */

      function statCard(value, label) {
        return `

              <div class="px-4 py-6 text-center border-r border-slate-200 last:border-0 dark:border-slate-800">

                  <p class="text-2xl font-bold">
                      ${value}
                  </p>

                  <p class="mt-1 text-xs font-medium tracking-wide uppercase text-slate-500 dark:text-slate-400">
                      ${label}
                  </p>

              </div>

          `;
      }

      function sectionHeader(title, description, link, linkText) {
        return `

              <div class="flex items-end justify-between gap-4">

                  <div>

                      <p class="text-sm font-semibold tracking-wider uppercase text-emerald-600">
                          Explore
                      </p>

                      <h2 class="mt-2 text-3xl font-bold tracking-tight">
                          ${title}
                      </h2>

                      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
                          ${description}
                      </p>

                  </div>

                  ${
                    link
                      ? `
                              <a
                                  href="${link}"
                                  class="hidden text-sm font-semibold text-emerald-600 hover:text-emerald-700 sm:block"
                              >
                                  ${linkText}
                              </a>
                          `
                      : ""
                  }

              </div>

          `;
      }

      function bookCard(book) {
        const count = getBookSongs(book.id).length;

        return `

              <a
                  href="#/book/${book.id}"
                  class="p-5 transition bg-white border shadow-sm group rounded-2xl border-slate-200 hover:-translate-y-1 hover:border-emerald-200 hover:shadow-lg dark:border-slate-800 dark:bg-slate-950"
              >

                  <div class="flex items-start justify-between">

                      <div
                          class="flex items-center justify-center h-14 w-14 rounded-xl bg-emerald-50 text-emerald-600 dark:bg-emerald-950"
                      >
                          ${icons.music}
                      </div>


                      <span
                          class="
                              rounded-full
                              bg-slate-100
                              px-2.5
                              py-1
                              text-xs
                              font-medium
                              text-slate-600
                              dark:bg-slate-800
                              dark:text-slate-300
                          "
                      >
                          ${count} songs
                      </span>

                  </div>


                  <h3
                      class="mt-5 font-bold group-hover:text-emerald-600"
                  >
                      ${book.title}
                  </h3>


                  <p
                      class="mt-2 text-sm leading-6 line-clamp-2 text-slate-500 dark:text-slate-400"
                  >
                      ${book.description}
                  </p>


                  <div class="flex items-center mt-5 text-sm font-semibold text-emerald-600">

                      Browse songs

                      <span class="ml-2 transition group-hover:translate-x-1">
                          ${icons.arrow}
                      </span>

                  </div>

              </a>

          `;
      }

      function categoryCard(category) {
        const count = getCategorySongs(category.id).length;

        return `

              <a
                  href="#/category/${category.id}"
                  class="p-4 transition bg-white border rounded-xl border-slate-200 hover:border-emerald-300 hover:bg-emerald-50 dark:border-slate-800 dark:bg-slate-950 dark:hover:bg-emerald-950"
              >

                  <div class="text-2xl">
                      ${category.icon}
                  </div>

                  <h3 class="mt-3 text-sm font-semibold">
                      ${category.name}
                  </h3>

                  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
                      ${count} songs
                  </p>

              </a>

          `;
      }

      /* =========================================================
         BOOKS PAGE
      ========================================================= */

      function booksPage() {
        return `

              <div class="page-enter">

                  <div class="px-4 py-10 mx-auto max-w-7xl sm:px-6 lg:px-8">

                      ${breadcrumb("Home", "#/", "Song Books")}


                      <div class="mt-8">

                          <p class="text-sm font-semibold tracking-wider uppercase text-emerald-600">
                              Collection
                          </p>

                          <h1 class="mt-2 text-4xl font-bold">
                              Song Books
                          </h1>

                          <p class="max-w-2xl mt-3 text-slate-500 dark:text-slate-400">
                              Browse all available song books and discover their songs.
                          </p>

                      </div>


                      <div
                          class="grid gap-5 mt-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
                      >

                          ${SONG_BOOKS.map(bookCard).join("")}

                      </div>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         BOOK DETAIL
      ========================================================= */

      function bookPage(id) {
        const book = getBook(id);

        if (!book) {
          return notFoundPage();
        }

        const bookSongs = getBookSongs(book.id);

        return `

              <div class="page-enter">

                  <div class="max-w-5xl px-4 py-10 mx-auto sm:px-6">

                      ${breadcrumb("Song Books", "#/books", book.title)}


                      <div
                          class="p-6 mt-8 text-white rounded-2xl bg-gradient-to-br from-emerald-700 to-teal-600 sm:p-10"
                      >

                          <span class="text-4xl">
                              📖
                          </span>

                          <h1 class="mt-5 text-3xl font-bold sm:text-4xl">
                              ${book.title}
                          </h1>

                          <p class="max-w-2xl mt-3 text-emerald-50">
                              ${book.description}
                          </p>

                          <div class="flex flex-wrap gap-3 mt-6">

                              <span class="rounded-full bg-white/10 px-3 py-1.5 text-sm">
                                  ${bookSongs.length} songs
                              </span>

                              <span class="rounded-full bg-white/10 px-3 py-1.5 text-sm">
                                  ${book.year}
                              </span>

                          </div>

                      </div>


                      <div class="mt-10">

                          <h2 class="text-2xl font-bold">
                              Songs in this book
                          </h2>

                          <div
                              class="mt-5 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                          >

                              ${
                                bookSongs.length
                                  ? bookSongs.map(songCard).join("")
                                  : emptyState("No songs in this book.")
                              }

                          </div>

                      </div>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         CATEGORIES PAGE
      ========================================================= */

      function categoriesPage() {
        return `

              <div class="page-enter">

                  <div class="px-4 py-10 mx-auto max-w-7xl sm:px-6 lg:px-8">

                      ${breadcrumb("Home", "#/", "Categories")}


                      <div class="mt-8">

                          <p class="text-sm font-semibold tracking-wider uppercase text-emerald-600">
                              Explore
                          </p>

                          <h1 class="mt-2 text-4xl font-bold">
                              Categories
                          </h1>

                          <p class="max-w-2xl mt-3 text-slate-500 dark:text-slate-400">
                              Find songs by theme, occasion or purpose.
                          </p>

                      </div>


                      <div
                          class="grid grid-cols-2 gap-4 mt-10 sm:grid-cols-3 lg:grid-cols-4"
                      >

                          ${categories.map(categoryLargeCard).join("")}

                      </div>

                  </div>

              </div>

          `;
      }

      function categoryLargeCard(category) {
        const count = getCategorySongs(category.id).length;

        return `

              <a
                  href="#/category/${category.id}"
                  class="p-6 transition bg-white border group rounded-2xl border-slate-200 hover:-translate-y-1 hover:border-emerald-300 hover:shadow-lg dark:border-slate-800 dark:bg-slate-950"
              >

                  <div class="text-4xl">
                      ${category.icon}
                  </div>

                  <h2
                      class="mt-5 text-lg font-bold group-hover:text-emerald-600"
                  >
                      ${category.name}
                  </h2>

                  <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">
                      ${category.description}
                  </p>

                  <p class="mt-5 text-sm font-semibold text-emerald-600">
                      ${count} songs →
                  </p>

              </a>

          `;
      }

      /* =========================================================
         CATEGORY DETAIL
      ========================================================= */

      function categoryPage(id) {
        const category = getCategory(id);

        if (!category) {
          return notFoundPage();
        }

        const categorySongs = getCategorySongs(category.id);

        return `

              <div class="page-enter">

                  <div class="max-w-5xl px-4 py-10 mx-auto sm:px-6">

                      ${breadcrumb("Categories", "#/categories", category.name)}


                      <div
                          class="p-6 mt-8 bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950 sm:p-10"
                      >

                          <span class="text-5xl">
                              ${category.icon}
                          </span>

                          <h1 class="mt-5 text-3xl font-bold">
                              ${category.name}
                          </h1>

                          <p class="max-w-2xl mt-3 text-slate-500 dark:text-slate-400">
                              ${category.description}
                          </p>

                          <p class="mt-5 text-sm font-semibold text-emerald-600">
                              ${categorySongs.length} songs
                          </p>

                      </div>


                      <div class="mt-10">

                          <h2 class="text-2xl font-bold">
                              Songs
                          </h2>

                          <div
                              class="mt-5 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                          >

                              ${
                                categorySongs.length
                                  ? categorySongs.map(songCard).join("")
                                  : emptyState("No songs in this category.")
                              }

                          </div>

                      </div>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         ALL SONGS
      ========================================================= */

      function songsPage() {
        return `

              <div class="page-enter">

                  <div class="max-w-5xl px-4 py-10 mx-auto sm:px-6">

                      ${breadcrumb("Home", "#/", "All Songs")}


                      <div class="mt-8">

                          <h1 class="text-4xl font-bold">
                              All Songs
                          </h1>

                          <p class="mt-3 text-slate-500 dark:text-slate-400">
                              Browse the complete song collection.
                          </p>

                      </div>


                      <div
                          class="mt-8 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                      >

                          ${songs.map(songCard).join("")}

                      </div>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         SEARCH PAGE
      ========================================================= */

      function searchPage() {
        const query =
          new URLSearchParams(location.hash.split("?")[1] || "").get("q") || "";

        state.search = query;

        const results = searchSongs(query);

        return `

              <div class="page-enter">

                  <div class="max-w-5xl px-4 py-10 mx-auto sm:px-6">

                      ${breadcrumb("Home", "#/", "Search")}


                      <div class="mt-8">

                          <h1 class="text-4xl font-bold">
                              Search Songs
                          </h1>

                          <form
                              onsubmit="searchPageSubmit(event)"
                              class="relative mt-6"
                          >

                              <div class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                  ${icons.search}
                              </div>

                              <input
                                  id="searchPageInput"
                                  type="search"
                                  value="${escapeHtml(query)}"
                                  placeholder="Search songs..."
                                  class="w-full pl-12 pr-4 bg-white border outline-none h-14 rounded-xl border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 dark:border-slate-800 dark:bg-slate-950"
                              >

                          </form>

                      </div>


                      <div class="mt-8">

                          ${
                            query
                              ? `
                                      <p class="mb-4 text-sm text-slate-500 dark:text-slate-400">
                                          ${results.length}
                                          result${results.length === 1 ? "" : "s"}
                                          for
                                          <strong>"${escapeHtml(query)}"</strong>
                                      </p>
                                  `
                              : ""
                          }


                          ${
                            results.length
                              ? `
                                      <div
                                          class="overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                                      >
                                          ${results.map(songCard).join("")}
                                      </div>
                                  `
                              : emptyState(
                                  query
                                    ? "No songs matched your search."
                                    : "Start typing to search the song library.",
                                )
                          }

                      </div>

                  </div>

              </div>

          `;
      }

      function searchSongs(query) {
        query = String(query || "")
          .toLowerCase()
          .trim();

        if (!query) {
          return songs;
        }

        return songs.filter((song) => {
          const book = getBook(song.bookId);
          const category = getCategory(song.categoryId);

          return (
            song.title.toLowerCase().includes(query) ||
            song.author.toLowerCase().includes(query) ||
            song.lyrics.toLowerCase().includes(query) ||
            book.title.toLowerCase().includes(query) ||
            category.name.toLowerCase().includes(query)
          );
        });
      }

      /* =========================================================
         SONG DETAIL
      ========================================================= */

      function songPage(id) {
        const song = getSong(id);

        if (!song) {
          return notFoundPage();
        }

        const book = getBook(song.bookId);
        const category = getCategory(song.categoryId);

        const index = songs.findIndex((item) => item.id === song.id);

        const previous = songs[index - 1] || null;

        const next = songs[index + 1] || null;

        const related = songs
          .filter(
            (item) =>
              item.id !== song.id &&
              (item.categoryId === song.categoryId ||
                item.bookId === song.bookId),
          )
          .slice(0, 4);

        return `

              <div class="page-enter">

                  <div class="max-w-4xl px-4 py-8 mx-auto sm:px-6 sm:py-12">

                      ${breadcrumb("Songs", "#/songs", song.title)}


                      <!-- SONG HEADER -->

                      <section
                          class="p-6 mt-8 bg-white border shadow-sm rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950 sm:p-8"
                      >

                          <div class="flex items-start justify-between gap-5">

                              <div>

                                  <div class="flex flex-wrap gap-2">

                                      <a
                                          href="#/category/${category.id}"
                                          class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300"
                                      >
                                          ${category.name}
                                      </a>


                                      <a
                                          href="#/book/${book.id}"
                                          class="px-3 py-1 text-xs font-medium rounded-full bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300"
                                      >
                                          ${book.title}
                                      </a>

                                  </div>


                                  <h1 class="mt-5 text-3xl font-bold tracking-tight sm:text-4xl">
                                      ${song.title}
                                  </h1>


                                  <p class="mt-2 text-slate-500 dark:text-slate-400">
                                      ${song.author}
                                  </p>

                              </div>


                              <div
                                  class="items-center justify-center hidden w-16 h-16 font-bold shrink-0 rounded-2xl bg-emerald-50 text-emerald-600 dark:bg-emerald-950 sm:flex"
                              >
                                  ${song.number}
                              </div>

                          </div>


                          <div
                              class="grid grid-cols-2 gap-4 pt-6 mt-8 border-t border-slate-100 dark:border-slate-800 sm:grid-cols-4"
                          >

                              ${songMeta("Book", book.title)}

                              ${songMeta("Category", category.name)}

                              ${songMeta("Language", song.language)}

                              ${songMeta("Song No.", song.number)}

                          </div>

                      </section>


                      <!-- ACTIONS -->

                      <div class="flex flex-wrap gap-2 mt-5">

                          <button
                              onclick="toggleFavorite(${song.id})"
                              class="
                                  inline-flex
                                  items-center
                                  gap-2
                                  rounded-lg
                                  border
                                  border-slate-200
                                  bg-white
                                  px-4
                                  py-2.5
                                  text-sm
                                  font-medium
                                  shadow-sm
                                  hover:border-emerald-200
                                  hover:bg-emerald-50
                                  dark:border-slate-800
                                  dark:bg-slate-950
                                  dark:hover:bg-emerald-950
                              "
                          >

                              <span class="${
                                isFavorite(song.id)
                                  ? "text-emerald-600"
                                  : "text-slate-400"
                              }">
                                  ${icons.heart}
                              </span>

                              ${
                                isFavorite(song.id)
                                  ? "Remove Favorite"
                                  : "Add Favorite"
                              }

                          </button>


                          <button
                              onclick="changeFontSize()"
                              class="
                                  rounded-lg
                                  border
                                  border-slate-200
                                  bg-white
                                  px-4
                                  py-2.5
                                  text-sm
                                  font-medium
                                  shadow-sm
                                  hover:bg-slate-50
                                  dark:border-slate-800
                                  dark:bg-slate-950
                                  dark:hover:bg-slate-900
                              "
                          >
                              A+ Text Size
                          </button>


                          <button
                              onclick="copySong(${song.id})"
                              class="
                                  rounded-lg
                                  border
                                  border-slate-200
                                  bg-white
                                  px-4
                                  py-2.5
                                  text-sm
                                  font-medium
                                  shadow-sm
                                  hover:bg-slate-50
                                  dark:border-slate-800
                                  dark:bg-slate-950
                                  dark:hover:bg-slate-900
                              "
                          >
                              Copy Lyrics
                          </button>


                          <button
                              onclick="window.print()"
                              class="
                                  rounded-lg
                                  border
                                  border-slate-200
                                  bg-white
                                  px-4
                                  py-2.5
                                  text-sm
                                  font-medium
                                  shadow-sm
                                  hover:bg-slate-50
                                  dark:border-slate-800
                                  dark:bg-slate-950
                                  dark:hover:bg-slate-900
                              "
                          >
                              Print
                          </button>

                      </div>


                      <!-- LYRICS -->

                      <article
                          class="px-6 py-8 mt-5 bg-white border shadow-sm rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950 sm:px-10 sm:py-12"
                      >

                          <div
                              id="lyrics"
                              class="max-w-2xl lyrics text-slate-700 dark:text-slate-200"
                              style="font-size:${state.fontSize}px; line-height:1.8"
                          >
                              ${escapeHtml(song.lyrics)}
                          </div>

                      </article>


                      <!-- PREVIOUS / NEXT -->

                      <div class="grid grid-cols-2 gap-3 mt-5">

                          ${
                            previous
                              ? `
                                      <a
                                          href="#/song/${previous.id}"
                                          class="p-4 bg-white border rounded-xl border-slate-200 hover:border-emerald-300 dark:border-slate-800 dark:bg-slate-950"
                                      >

                                          <span class="text-xs text-slate-400">
                                              Previous Song
                                          </span>

                                          <strong class="block mt-1 truncate">
                                              ${previous.title}
                                          </strong>

                                      </a>
                                  `
                              : "<div></div>"
                          }


                          ${
                            next
                              ? `
                                      <a
                                          href="#/song/${next.id}"
                                          class="p-4 text-right bg-white border rounded-xl border-slate-200 hover:border-emerald-300 dark:border-slate-800 dark:bg-slate-950"
                                      >

                                          <span class="text-xs text-slate-400">
                                              Next Song
                                          </span>

                                          <strong class="block mt-1 truncate">
                                              ${next.title}
                                          </strong>

                                      </a>
                                  `
                              : "<div></div>"
                          }

                      </div>


                      <!-- RELATED -->

                      ${
                        related.length
                          ? `
                                  <section class="mt-12">

                                      <h2 class="text-2xl font-bold">
                                          Related Songs
                                      </h2>

                                      <div
                                          class="mt-5 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                                      >

                                          ${related.map(songCard).join("")}

                                      </div>

                                  </section>
                              `
                          : ""
                      }

                  </div>

              </div>

          `;
      }

      function songMeta(label, value) {
        return `

              <div>

                  <p
                      class="text-xs font-medium tracking-wide uppercase text-slate-400"
                  >
                      ${label}
                  </p>

                  <p class="mt-1 text-sm font-semibold">
                      ${value}
                  </p>

              </div>

          `;
      }

      /* =========================================================
         FAVORITES
      ========================================================= */

      function favoritesPage() {
        const favoriteSongs = songs.filter((song) =>
          state.favorites.includes(song.id),
        );

        return `

              <div class="page-enter">

                  <div class="max-w-5xl px-4 py-10 mx-auto sm:px-6">

                      ${breadcrumb("Home", "#/", "Favorites")}


                      <div class="mt-8">

                          <p class="text-sm font-semibold tracking-wider uppercase text-emerald-600">
                              Your Collection
                          </p>

                          <h1 class="mt-2 text-4xl font-bold">
                              Favorite Songs
                          </h1>

                          <p class="mt-3 text-slate-500 dark:text-slate-400">
                              ${favoriteSongs.length} favorite songs
                          </p>

                      </div>


                      <div
                          class="mt-8 overflow-hidden bg-white border rounded-2xl border-slate-200 dark:border-slate-800 dark:bg-slate-950"
                      >

                          ${
                            favoriteSongs.length
                              ? favoriteSongs.map(songCard).join("")
                              : emptyState(
                                  "You have not added any favorite songs yet.",
                                )
                          }

                      </div>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         BREADCRUMB
      ========================================================= */

      function breadcrumb(parent, parentUrl, current) {
        return `

              <nav
                  class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400"
              >

                  <a
                      href="${parentUrl}"
                      class="hover:text-emerald-600"
                  >
                      ${parent}
                  </a>

                  <span>/</span>

                  <span class="truncate text-slate-700 dark:text-slate-300">
                      ${current}
                  </span>

              </nav>

          `;
      }

      /* =========================================================
         EMPTY STATE
      ========================================================= */

      function emptyState(message) {
        return `

              <div class="p-12 text-center">

                  <div class="text-4xl">
                      🎵
                  </div>

                  <h3 class="mt-4 font-semibold">
                      Nothing here
                  </h3>

                  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
                      ${message}
                  </p>

              </div>

          `;
      }

      /* =========================================================
         404
      ========================================================= */

      function notFoundPage() {
        return `

              <div
                  class="
                      flex
                      min-h-[70vh]
                      items-center
                      justify-center
                      px-4
                  "
              >

                  <div class="text-center">

                      <div class="text-6xl">
                          🎵
                      </div>

                      <h1 class="mt-5 text-3xl font-bold">
                          Page Not Found
                      </h1>

                      <p class="mt-2 text-slate-500 dark:text-slate-400">
                          The song or page you're looking for doesn't exist.
                      </p>

                      <a
                          href="#/"
                          class="inline-flex px-5 py-3 mt-6 text-sm font-semibold text-white rounded-lg bg-emerald-600 hover:bg-emerald-700"
                      >
                          Back to Home
                      </a>

                  </div>

              </div>

          `;
      }

      /* =========================================================
         ESCAPE HTML
      ========================================================= */

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =========================================================
         ROUTER
      ========================================================= */

      function router() {
        const hash = location.hash || "#/";

        const path = hash.split("?")[0];

        let content = "";

        if (path === "#" || path === "#/") {
          content = homePage();
        } else if (path === "#/books") {
          content = booksPage();
        } else if (path === "#/songs") {
          content = songsPage();
        } else if (path === "#/categories") {
          content = categoriesPage();
        } else if (path === "#/search") {
          content = searchPage();
        } else if (path === "#/favorites") {
          content = favoritesPage();
        } else if (path.startsWith("#/book/")) {
          const id = path.split("/")[2];

          content = bookPage(id);
        } else if (path.startsWith("#/category/")) {
          const id = path.split("/")[2];

          content = categoryPage(id);
        } else if (path.startsWith("#/song/")) {
          const id = path.split("/")[2];

          content = songPage(id);
        } else {
          content = notFoundPage();
        }

        document.getElementById("app").innerHTML = `

              ${renderHeader()}

              <main class="flex-1">

                  ${content}

              </main>

              ${renderFooter()}

          `;

        window.scrollTo({
          top: 0,
          behavior: "instant",
        });
      }

      /* =========================================================
         SEARCH
      ========================================================= */

      function homeSearch(event) {
        event.preventDefault();

        const input = document.getElementById("homeSearchInput");

        const query = input.value.trim();

        if (!query) {
          location.hash = "#/search";

          return;
        }

        location.hash = "#/search?q=" + encodeURIComponent(query);
      }

      function searchPageSubmit(event) {
        event.preventDefault();

        const input = document.getElementById("searchPageInput");

        const query = input.value.trim();

        location.hash = "#/search?q=" + encodeURIComponent(query);
      }

      /* =========================================================
         THEME
      ========================================================= */

      function initializeTheme() {
        const saved = localStorage.getItem("song-library-theme");

        if (saved === "dark") {
          document.documentElement.classList.add("dark");
        } else if (saved === "light") {
          document.documentElement.classList.remove("dark");
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.classList.add("dark");
        }
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle("dark");

        localStorage.setItem("song-library-theme", isDark ? "dark" : "light");

        router();
      }

      /* =========================================================
         SONG ACTIONS
      ========================================================= */

      function changeFontSize() {
        state.fontSize += 2;

        if (state.fontSize > 28) {
          state.fontSize = 18;
        }

        const lyrics = document.getElementById("lyrics");

        if (lyrics) {
          lyrics.style.fontSize = `${state.fontSize}px`;
        }
      }

      async function copySong(id) {
        const song = getSong(id);

        if (!song) return;

        try {
          await navigator.clipboard.writeText(
            `${song.title}\n\n${song.lyrics}`,
          );

          alert("Lyrics copied to clipboard.");
        } catch (error) {
          alert("Unable to copy lyrics.");
        }
      }

      /* =========================================================
         KEYBOARD SHORTCUT
      ========================================================= */

      document.addEventListener("keydown", (event) => {
        if (event.key === "/" && document.activeElement.tagName !== "INPUT") {
          event.preventDefault();

          location.hash = "#/search";
        }
      });

      /* =========================================================
         ROUTER EVENTS
      ========================================================= */

      window.addEventListener("hashchange", router);

      /* =========================================================
         INITIALIZE
      ========================================================= */

      initializeTheme();

      async function initializeApp() {
        await initDatabase();

        router();
      }

      initializeApp();

      function getSongs() {
        if (!db) {
          return [];
        }

        const result = db.exec(`
        SELECT
            id,
            song_book_id,
            category_id,
            number,
            title,
            author,
            language,
            lyrics
        FROM songs
        ORDER BY song_book_id, number
    `);

        if (!result.length) {
          return [];
        }

        return result[0].values.map((row) => ({
          id: Number(row[0]),
          bookId: Number(row[1]),
          categoryId: Number(row[2]),
          number: row[3] ?? "",
          title: row[4] ?? "",
          author: row[5] ?? "",
          language: row[6] ?? "",
          lyrics: row[7] ?? "",
        }));
      }

      const songs = getSongs();

      console.log(songs);

      function getBooks() {
        if (!db) {
          return [];
        }

        const result = db.exec(`
        SELECT
            id,
            title,
            description,
            year
        FROM song_books
        ORDER BY id
    `);

        if (!result.length) {
          return [];
        }

        return result[0].values.map((row) => ({
          id: row[0],
          title: row[1],
          description: row[2],
          year: row[3],
        }));
      }

      const books = getBooks();
      console.log(books);

      function getCategories() {
        if (!db) {
          return [];
        }

        const result = db.exec(`
        SELECT
            id,
            song_book_id,
            name,
            description,
            icon
        FROM categories
        ORDER BY name
    `);

        if (!result.length) {
          return [];
        }

        return result[0].values.map((row) => ({
          id: Number(row[0]),
          bookId: Number(row[1]),
          name: row[2] ?? "",
          description: row[3] ?? "",
          icon: row[4] ?? "🎵",
        }));
      }

      const categories = getCategories();
      console.log(categories);
    </script>
  </body>
</html>
